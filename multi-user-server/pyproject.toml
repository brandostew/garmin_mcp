[project]
name = "nutrition-server"
version = "0.1.0"
description = "Multi-user MCP server: each person's Cronometer and Garmin data, kept strictly separate"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.23.0,<2.0.0",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "cryptography>=43",
]

[project.scripts]
nutrition-server = "nutrition_server.server:main"
nutrition-admin = "nutrition_server.admin:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrition_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
